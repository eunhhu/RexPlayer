[package]
name = "rex-keymap"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Validated window-scoped keyboard and mouse to multitouch translation"

[features]
default = []
linux-adapter = ["dep:rex-input-linux"]

[dependencies]
rex-input-core = { path = "../input" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
rex-input-linux = { path = "../input-linux", optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
evdev = "=0.13.2"
