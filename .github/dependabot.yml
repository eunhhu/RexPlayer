# Dependabot configuration for RexPlayer.
#
# The components are independent crates with their own lockfiles (there is no
# workspace at the repository root), so each directory needs its own cargo entry.
# GitHub Actions are updated as one grouped pull request to keep the pinned-SHA
# churn reviewable.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/proof/input-rust"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: "/core/input"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: "/core/launcher"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: "/core/input-linux"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: "/core/keymap"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: "/core/media"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: "/core/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
